name: Yelo listas

on:
  schedule:
    - cron: "*/5 * * * *"   # revisar el correo cada 5 min (GitHub puede retrasarlo)
    - cron: "0 12 1 * *"    # keepalive mensual para que GitHub no desactive el workflow
  workflow_dispatch:         # botón "Run workflow" para probar a mano

permissions:
  contents: read
  actions: write

concurrency:
  group: yelo-bot
  cancel-in-progress: false

jobs:
  revisar:
    if: github.event.schedule != '0 12 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Revisar correo
        run: python main.py revisar
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TITULAR_NOMBRE: ${{ secrets.TITULAR_NOMBRE }}
          TITULAR_APELLIDOS: ${{ secrets.TITULAR_APELLIDOS }}
          YELO_FROM: ${{ vars.YELO_FROM || 'yelo' }}
          XCEED_ENTRADAS: ${{ vars.XCEED_ENTRADAS || '6' }}
          DIAS_ATRAS: "7"

  keepalive:
    if: github.event.schedule == '0 12 1 * *'
    runs-on: ubuntu-latest
    steps:
      - name: Mantener activo el workflow programado
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/yelo.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
